<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
      Os links de recuperação trazem o segredo na query string. Sem isto,
      o browser mandaria o endereço completo — segredo incluído — no
      cabeçalho Referer de qualquer recurso que a página fosse buscar
      lá fora.
    -->
    <meta name="referrer" content="no-referrer">

    <!--
      A cor da página, dita ao browser antes de haver folha de estilo.

      `color-scheme` evita o clarão branco do primeiro instante: sem ele,
      o browser pinta a tela de branco até o CSS chegar, e num telemóvel
      lento isso é meio segundo de flash. `theme-color` é a mesma cor na
      barra do sistema, para a página não acabar a meio do ecrã.

      O valor está escrito também no `manifest.webmanifest`, que é lido
      por outro programa (o instalador da app) e não pode ler um token
      de CSS. Há um teste que os obriga a ser o mesmo que `--ground`.
    -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0B0711">
    <meta name="description" content="ViceHub — a plataforma para crews, servidores e jogadores.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <title>ViceHub</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
