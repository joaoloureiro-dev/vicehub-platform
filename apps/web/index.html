<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
      Os links de recuperação trazem o segredo na query string. Sem isto,
      o browser mandaria o endereço completo — segredo incluído — no
      cabeçalho Referer de qualquer recurso que a página fosse buscar
      lá fora.
    -->
    <meta name="referrer" content="no-referrer">

    <meta name="theme-color" content="#08060F">
    <meta name="description" content="ViceHub — a plataforma para crews, servidores e jogadores.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <title>ViceHub</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
