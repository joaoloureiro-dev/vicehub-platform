name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Um push novo sobre o mesmo ramo torna a execução anterior irrelevante.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tipos e testes
    runs-on: ubuntu-latest

    env:
      # Usado pelo prisma.config.ts, pelas migrações e pelos testes de
      # integração. Aponta para o serviço abaixo.
      DATABASE_URL: postgresql://vicehub:vicehub@localhost:5432/vicehub_ci

    # A suite unitária corre com duplos em memória, mas há garantias que
    # nenhum duplo consegue dar: duas aprovações simultâneas do mesmo
    # movimento de tesouraria, ou duas saídas que juntas excedem o saldo.
    # Quem decide quem chega primeiro é a base de dados, e por isso os
    # testes de integração precisam de uma a sério.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vicehub
          POSTGRES_PASSWORD: vicehub
          POSTGRES_DB: vicehub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          # Os workspaces declaram engines >=24. O Node 24 traz npm 11.
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O Prisma Client é gerado, não versionado. Sem este passo, a compilação
      # do package database falha por não encontrar os tipos de @prisma/client.
      - name: Gerar o Prisma Client
        run: npm run db:generate

      - name: Validar o schema Prisma
        run: npm run db:validate

      - name: Compilar
        run: npm run build

      - name: Verificar tipos
        run: npm run typecheck

      - name: Correr testes
        run: npm run test

      # As migrações e o seed correm antes dos testes de integração porque
      # eles usam cargos e permissões reais do catálogo.
      - name: Preparar a base de dados de integração
        run: |
          npm run db:migrate:deploy
          npm run db:seed

      - name: Correr testes de integração
        run: npm run test:integration
